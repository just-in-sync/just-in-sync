<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#d1d3c4" stroke-width="1.5" stroke-opacity="0.6"/>
    </pattern>
    <g id="stack">
      <rect class="head" x="1" y="0"   width="18" height="18" rx="4"/>
      <rect class="t1"   x="1" y="-20" width="18" height="18" rx="4"/>
      <rect class="t2"   x="1" y="-40" width="18" height="18" rx="4"/>
      <rect class="t3"   x="1" y="-60" width="18" height="18" rx="4"/>
      <rect class="t4"   x="1" y="-80" width="18" height="18" rx="4"/>
    </g>
    <clipPath id="bandReveal">
      <rect class="rvBand" x="96" y="0" width="0" height="300"/>
    </clipPath>
    <clipPath id="textReveal">
      <rect class="rvText" x="116" y="0" width="0" height="300"/>
    </clipPath>
  </defs>

  <style>
    .title { fill: #000000; }
    .band { fill: #ffffff; fill-opacity: 0.9; }
    .head { fill: #d1d3c4; }
    .t1 { fill: #d1d3c4; fill-opacity: 0.55; }
    .t2 { fill: #d1d3c4; fill-opacity: 0.35; }
    .t3 { fill: #d1d3c4; fill-opacity: 0.2; }
    .t4 { fill: #d1d3c4; fill-opacity: 0.1; }
    .drop { animation: fall linear infinite; animation-timing-function: steps(21, end); }
    .cursor { fill: #d1d3c4; animation: blink 1s steps(1) infinite; }
    .rvBand { animation: typeBand 2.4s steps(12) forwards; }
    .rvText { animation: typeText 2.4s steps(12) forwards; }

    @media (prefers-color-scheme: dark) {
      .title { fill: #ffffff; }
      .band { fill: #0d1117; fill-opacity: 0.9; }
    }

    @keyframes fall {
      from { transform: translateY(-100px); }
      to   { transform: translateY(320px); }
    }
    @keyframes typeBand {
      from { width: 0px; }
      to   { width: 608px; }
    }
    @keyframes typeText {
      from { width: 0px; }
      to   { width: 568px; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <rect width="800" height="300" fill="url(#grid)"/>

  <use class="drop" href="#stack" x="40"  style="animation-duration:2.4s; animation-delay:-0.3s"/>
  <use class="drop" href="#stack" x="100" style="animation-duration:1.6s; animation-delay:-1.1s"/>
  <use class="drop" href="#stack" x="180" style="animation-duration:1.2s; animation-delay:-0.5s"/>
  <use class="drop" href="#stack" x="240" style="animation-duration:2.8s; animation-delay:-2.0s"/>
  <use class="drop" href="#stack" x="300" style="animation-duration:1.8s; animation-delay:-0.9s"/>
  <use class="drop" href="#stack" x="300" style="animation-duration:2.6s; animation-delay:-2.2s"/>
  <use class="drop" href="#stack" x="380" style="animation-duration:1.4s; animation-delay:-1.6s"/>
  <use class="drop" href="#stack" x="440" style="animation-duration:2.2s; animation-delay:-0.2s"/>
  <use class="drop" href="#stack" x="520" style="animation-duration:1.0s; animation-delay:-0.7s"/>
  <use class="drop" href="#stack" x="520" style="animation-duration:2.0s; animation-delay:-1.9s"/>
  <use class="drop" href="#stack" x="580" style="animation-duration:2.6s; animation-delay:-1.3s"/>
  <use class="drop" href="#stack" x="660" style="animation-duration:1.7s; animation-delay:-0.4s"/>
  <use class="drop" href="#stack" x="720" style="animation-duration:1.3s; animation-delay:-1.8s"/>
  <use class="drop" href="#stack" x="720" style="animation-duration:2.9s; animation-delay:-0.6s"/>

  <g clip-path="url(#bandReveal)">
    <rect class="band" x="96" y="84" width="608" height="92" rx="6"/>
  </g>

  <g clip-path="url(#textReveal)">
    <g class="title" transform="translate(116 100) scale(8)">
      <g transform="translate(0 0)">
        <path d="M4 0h1v6h-1z M1 6h3v1h-3z M0 4h1v2h-1z"/>
      </g>
      <g transform="translate(6 0)">
        <path d="M0 0h1v7h-1z M4 0h1v7h-1z M1 6h3v1h-3z"/>
      </g>
      <g transform="translate(12 0)">
        <path d="M1 0h4v1h-4z M0 1h1v2h-1z M1 3h3v1h-3z M4 4h1v2h-1z M0 6h4v1h-4z"/>
      </g>
      <g transform="translate(18 0)">
        <path d="M0 0h5v1h-5z M2 1h1v6h-1z"/>
      </g>
      <g transform="translate(24 0)">
        <path d="M1 3h3v1h-3z"/>
      </g>
      <g transform="translate(30 0)">
        <path d="M1 0h3v1h-3z M2 1h1v5h-1z M1 6h3v1h-3z"/>
      </g>
      <g transform="translate(36 0)">
        <path d="M0 0h1v7h-1z M4 0h1v7h-1z M1 1h1v1h-1z M2 2h1v1h-1z M3 3h1v1h-1z"/>
      </g>
      <g transform="translate(42 0)">
        <path d="M1 3h3v1h-3z"/>
      </g>
      <g transform="translate(48 0)">
        <path d="M1 0h4v1h-4z M0 1h1v2h-1z M1 3h3v1h-3z M4 4h1v2h-1z M0 6h4v1h-4z"/>
      </g>
      <g transform="translate(54 0)">
        <path d="M0 0h1v2h-1z M4 0h1v2h-1z M1 2h1v1h-1z M3 2h1v1h-1z M2 3h1v4h-1z"/>
      </g>
      <g transform="translate(60 0)">
        <path d="M0 0h1v7h-1z M4 0h1v7h-1z M1 1h1v1h-1z M2 2h1v1h-1z M3 3h1v1h-1z"/>
      </g>
      <g transform="translate(66 0)">
        <path d="M1 0h3v1h-3z M0 1h1v5h-1z M1 6h3v1h-3z M4 1h1v1h-1z M4 5h1v1h-1z"/>
      </g>
    </g>
  </g>

  <rect class="cursor" x="690" y="100" width="8" height="56"/>
</svg>